<svg viewBox="0 0 900 640" width="720" height="512" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- Opaque light background so the figure is readable on any editor/browser theme -->
  <rect x="0" y="0" width="900" height="640" fill="#FFFFFF"/>

  <!-- ============================= Title ============================= -->
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1A1A1A">
    upSample &#8212; raising the sample rate by inserting zeros
  </text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#555">
    For every input sample the output receives n samples: the original value followed by (n &#8722; 1) zeros. Example below uses n = 3.
  </text>

  <!-- ============================= Legend ============================= -->
  <g font-size="12">
    <rect x="150" y="68" width="16" height="14" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.6"/>
    <text x="172" y="80" fill="#333">input sample</text>

    <rect x="300" y="68" width="16" height="14" rx="3" fill="#E6F3FF" stroke="#2196F3" stroke-width="1.6"/>
    <text x="322" y="80" fill="#333">same value in the output</text>

    <rect x="530" y="68" width="16" height="14" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.6"/>
    <text x="536" y="79" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="552" y="80" fill="#333">inserted zero</text>
  </g>

  <!-- ================= Panel A: one channel, phase = 0 ================= -->
  <text x="60" y="110" font-size="14" font-weight="bold" fill="#333">
    One channel, upSampling factor n = 3, phase = 0
  </text>

  <!-- input row (4 samples), positioned above their output slots 0,3,6,9 -->
  <text x="106" y="152" text-anchor="end" font-size="12" font-weight="bold" fill="#333">Input</text>
  <g font-size="13" text-anchor="middle" fill="#1A1A1A">
    <rect x="120" y="126" width="56" height="44" rx="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="148" y="153">s0</text>
    <rect x="288" y="126" width="56" height="44" rx="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="316" y="153">s1</text>
    <rect x="456" y="126" width="56" height="44" rx="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="484" y="153">s2</text>
    <rect x="624" y="126" width="56" height="44" rx="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="652" y="153">s3</text>
  </g>

  <!-- straight arrows: each input sample keeps its place, spaced 3 slots apart -->
  <g stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow-green)">
    <line x1="148" y1="170" x2="148" y2="230"/>
    <line x1="316" y1="170" x2="316" y2="230"/>
    <line x1="484" y1="170" x2="484" y2="230"/>
    <line x1="652" y1="170" x2="652" y2="230"/>
  </g>
  <text x="450" y="206" text-anchor="middle" font-size="12" fill="#4CAF50">
    keep the sample, then add (n &#8722; 1) = 2 zeros after it
  </text>

  <!-- output row (12 slots) -->
  <text x="106" y="258" text-anchor="end" font-size="12" font-weight="bold" fill="#333">Output</text>
  <g font-size="13" text-anchor="middle">
    <rect x="120" y="232" width="56" height="44" rx="5" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="148" y="259" fill="#1A1A1A">s0</text>
    <rect x="176" y="232" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="204" y="259" fill="#999">0</text>
    <rect x="232" y="232" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="260" y="259" fill="#999">0</text>
    <rect x="288" y="232" width="56" height="44" rx="5" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="316" y="259" fill="#1A1A1A">s1</text>
    <rect x="344" y="232" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="372" y="259" fill="#999">0</text>
    <rect x="400" y="232" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="428" y="259" fill="#999">0</text>
    <rect x="456" y="232" width="56" height="44" rx="5" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="484" y="259" fill="#1A1A1A">s2</text>
    <rect x="512" y="232" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="540" y="259" fill="#999">0</text>
    <rect x="568" y="232" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="596" y="259" fill="#999">0</text>
    <rect x="624" y="232" width="56" height="44" rx="5" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="652" y="259" fill="#1A1A1A">s3</text>
    <rect x="680" y="232" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="708" y="259" fill="#999">0</text>
    <rect x="736" y="232" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="764" y="259" fill="#999">0</text>
  </g>
  <!-- output slot indices -->
  <g font-size="10" text-anchor="middle" fill="#999">
    <text x="148" y="292">0</text><text x="204" y="292">1</text><text x="260" y="292">2</text>
    <text x="316" y="292">3</text><text x="372" y="292">4</text><text x="428" y="292">5</text>
    <text x="484" y="292">6</text><text x="540" y="292">7</text><text x="596" y="292">8</text>
    <text x="652" y="292">9</text><text x="708" y="292">10</text><text x="764" y="292">11</text>
  </g>

  <!-- divider -->
  <line x1="60" y1="312" x2="840" y2="312" stroke="#E0E0E0" stroke-width="1"/>

  <!-- ================= Panel B: effect of phase ================= -->
  <text x="60" y="336" font-size="14" font-weight="bold" fill="#333">
    The phase option chooses where the samples land (n = 3, phase = 1)
  </text>

  <text x="106" y="374" text-anchor="end" font-size="12" font-weight="bold" fill="#333">Output</text>
  <g font-size="13" text-anchor="middle">
    <rect x="120" y="348" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="148" y="375" fill="#999">0</text>
    <rect x="176" y="348" width="56" height="44" rx="5" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="204" y="375" fill="#1A1A1A">s0</text>
    <rect x="232" y="348" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="260" y="375" fill="#999">0</text>
    <rect x="288" y="348" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="316" y="375" fill="#999">0</text>
    <rect x="344" y="348" width="56" height="44" rx="5" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="372" y="375" fill="#1A1A1A">s1</text>
    <rect x="400" y="348" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="428" y="375" fill="#999">0</text>
    <rect x="456" y="348" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="484" y="375" fill="#999">0</text>
    <rect x="512" y="348" width="56" height="44" rx="5" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="540" y="375" fill="#1A1A1A">s2</text>
    <rect x="568" y="348" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="596" y="375" fill="#999">0</text>
    <rect x="624" y="348" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="652" y="375" fill="#999">0</text>
    <rect x="680" y="348" width="56" height="44" rx="5" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="708" y="375" fill="#1A1A1A">s3</text>
    <rect x="736" y="348" width="56" height="44" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="764" y="375" fill="#999">0</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#999">
    <text x="148" y="408">0</text><text x="204" y="408">1</text><text x="260" y="408">2</text>
    <text x="316" y="408">3</text><text x="372" y="408">4</text><text x="428" y="408">5</text>
    <text x="484" y="408">6</text><text x="540" y="408">7</text><text x="596" y="408">8</text>
    <text x="652" y="408">9</text><text x="708" y="408">10</text><text x="764" y="408">11</text>
  </g>
  <text x="60" y="432" font-size="12" fill="#666">
    phase = 1 moves every sample one slot later, so slot 0 becomes a zero. The phase must satisfy 0 &#8804; phase &lt; n.
  </text>

  <!-- divider -->
  <line x1="60" y1="452" x2="840" y2="452" stroke="#E0E0E0" stroke-width="1"/>

  <!-- ================= Panel C: multichannel ================= -->
  <text x="60" y="476" font-size="14" font-weight="bold" fill="#333">
    Every channel is upsampled independently
  </text>

  <!-- channel 0 -->
  <text x="132" y="504" text-anchor="end" font-size="11.5" font-weight="bold" fill="#333">Channel 0</text>
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="490" width="30" height="26" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.8"/><text x="165" y="507" fill="#1A1A1A">a0</text>
    <rect x="184" y="490" width="30" height="26" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.8"/><text x="199" y="507" fill="#1A1A1A">a1</text>
    <rect x="218" y="490" width="30" height="26" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.8"/><text x="233" y="507" fill="#1A1A1A">a2</text>
  </g>
  <!-- channel 1 -->
  <text x="132" y="540" text-anchor="end" font-size="11.5" font-weight="bold" fill="#333">Channel 1</text>
  <g font-size="11" text-anchor="middle">
    <rect x="150" y="526" width="30" height="26" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.8"/><text x="165" y="543" fill="#1A1A1A">b0</text>
    <rect x="184" y="526" width="30" height="26" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.8"/><text x="199" y="543" fill="#1A1A1A">b1</text>
    <rect x="218" y="526" width="30" height="26" rx="3" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.8"/><text x="233" y="543" fill="#1A1A1A">b2</text>
  </g>

  <!-- transform arrow -->
  <line x1="260" y1="521" x2="372" y2="521" stroke="#757575" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="316" y="512" text-anchor="middle" font-size="11" fill="#555">upSample, n = 3</text>

  <!-- channel 0 output (9 slots) -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="382" y="490" width="30" height="26" rx="3" fill="#E6F3FF" stroke="#2196F3" stroke-width="1.8"/><text x="397" y="507" fill="#1A1A1A">a0</text>
    <rect x="416" y="490" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="431" y="507" fill="#999">0</text>
    <rect x="450" y="490" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="465" y="507" fill="#999">0</text>
    <rect x="484" y="490" width="30" height="26" rx="3" fill="#E6F3FF" stroke="#2196F3" stroke-width="1.8"/><text x="499" y="507" fill="#1A1A1A">a1</text>
    <rect x="518" y="490" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="533" y="507" fill="#999">0</text>
    <rect x="552" y="490" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="567" y="507" fill="#999">0</text>
    <rect x="586" y="490" width="30" height="26" rx="3" fill="#E6F3FF" stroke="#2196F3" stroke-width="1.8"/><text x="601" y="507" fill="#1A1A1A">a2</text>
    <rect x="620" y="490" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="635" y="507" fill="#999">0</text>
    <rect x="654" y="490" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="669" y="507" fill="#999">0</text>
  </g>
  <!-- channel 1 output (9 slots) -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="382" y="526" width="30" height="26" rx="3" fill="#E6F3FF" stroke="#2196F3" stroke-width="1.8"/><text x="397" y="543" fill="#1A1A1A">b0</text>
    <rect x="416" y="526" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="431" y="543" fill="#999">0</text>
    <rect x="450" y="526" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="465" y="543" fill="#999">0</text>
    <rect x="484" y="526" width="30" height="26" rx="3" fill="#E6F3FF" stroke="#2196F3" stroke-width="1.8"/><text x="499" y="543" fill="#1A1A1A">b1</text>
    <rect x="518" y="526" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="533" y="543" fill="#999">0</text>
    <rect x="552" y="526" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="567" y="543" fill="#999">0</text>
    <rect x="586" y="526" width="30" height="26" rx="3" fill="#E6F3FF" stroke="#2196F3" stroke-width="1.8"/><text x="601" y="543" fill="#1A1A1A">b2</text>
    <rect x="620" y="526" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="635" y="543" fill="#999">0</text>
    <rect x="654" y="526" width="30" height="26" rx="3" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.3"/><text x="669" y="543" fill="#999">0</text>
  </g>

  <text x="60" y="576" font-size="12" fill="#666">
    Channels never mix. In the planar layout each channel is one row; in the interleaved layout each time instant is one row &#8212; the zero pattern is the same.
  </text>

  <!-- ================= Footer note ================= -->
  <rect x="60" y="592" width="780" height="34" rx="5" fill="#FFF8E1" stroke="#FFCA28" stroke-width="1"/>
  <text x="72" y="613" font-size="12" fill="#7A5B00">
    Note: this is pure zero insertion &#8212; no smoothing or filtering is applied. For a filtered (interpolated) result, follow it with a low-pass filter or use a sample-rate converter.
  </text>

  <!-- ================= Arrow markers ================= -->
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
    <marker id="arrow-grey" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#757575"/>
    </marker>
  </defs>
</svg>
