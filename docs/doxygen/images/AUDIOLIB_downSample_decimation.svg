<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
    Decimation (downSampleRatio = 3, phase = 0), single channel
  </text>

  <!-- Input sample row s0..s8 -->
  <text x="40" y="95" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold">input</text>
  <g id="input-samples" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <!-- kept samples (s0,s3,s6) highlighted green, dropped ones grey -->
    <rect x="60"  y="70" width="60" height="45" rx="4" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="90"  y="97">s0</text>
    <rect x="130" y="70" width="60" height="45" rx="4" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="160" y="97" fill="#999">s1</text>
    <rect x="200" y="70" width="60" height="45" rx="4" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="230" y="97" fill="#999">s2</text>
    <rect x="270" y="70" width="60" height="45" rx="4" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="300" y="97">s3</text>
    <rect x="340" y="70" width="60" height="45" rx="4" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="370" y="97" fill="#999">s4</text>
    <rect x="410" y="70" width="60" height="45" rx="4" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="440" y="97" fill="#999">s5</text>
    <rect x="480" y="70" width="60" height="45" rx="4" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
    <text x="510" y="97">s6</text>
    <rect x="550" y="70" width="60" height="45" rx="4" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="580" y="97" fill="#999">s7</text>
    <rect x="620" y="70" width="60" height="45" rx="4" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="650" y="97" fill="#999">s8</text>
  </g>

  <!-- keep-every-3rd arrows from s0, s3, s6 down to the output row -->
  <text x="380" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4CAF50">keep every 3rd sample</text>
  <line x1="90"  y1="115" x2="90"  y2="235" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="300" y1="115" x2="230" y2="235" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="510" y1="115" x2="370" y2="235" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead-green)"/>

  <!-- Output sample row -->
  <text x="40" y="265" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold">output</text>
  <g id="output-samples" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="60"  y="240" width="60" height="45" rx="4" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="90"  y="267">s0</text>
    <rect x="200" y="240" width="60" height="45" rx="4" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="230" y="267">s3</text>
    <rect x="340" y="240" width="60" height="45" rx="4" fill="#E6F3FF" stroke="#2196F3" stroke-width="2"/>
    <text x="370" y="267">s6</text>
  </g>

  <!-- Note about phase -->
  <text x="60" y="315" font-family="Arial, sans-serif" font-size="11" fill="#666">
    phase = 1 starts the pattern one sample later, keeping s1, s4, s7.
  </text>

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
  </defs>
</svg>
